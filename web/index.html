<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aura Beat - YouTube Music Client">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aura Beat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aura Beat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #FEDBB3;
      margin: 0;
      padding: 0;
    }
  </style>
  <script>
    // AuraBeat Web Audio Spatial Engine with 7-Band Equalizer & Sub-Bass DSP
    window.AuraBeatAudio = (function() {
      var ctx = null;
      var isPlaying = false;
      var isSpatial = true;
      var spatialWidth = 2.4;
      var spatialDepth = 0.75;
      var spatialIntensity = 1.0;
      var isBassBoost = true;
      var bassGainDb = 10.0;
      var isSubBass = true;
      var isSubBassEnhancement = false;
      var subBassIntensity = 0.50;
      var subBassFrequency = 60.0;
      var subBassOutputLevelDb = 0.0;
      var subBassPresetName = 'Natural Sub-Bass';
      var subBassGainDb = 10.0;
      var masterGain = null;
      var preampGain = null;
      var masterLimiter = null;
      var currentVolume = 1.0;
      var channelLeftGain = null;
      var channelRightGain = null;
      var leftPanner = null;
      var rightPanner = null;
      var crossGainL = null;
      var crossGainR = null;
      var delayL = null;
      var delayR = null;
      var filterL = null;
      var filterR = null;
      var ultraSubBassFilter = null;
      var bassBoostFilter = null;
      var subBassFilter = null;
      var punchFilter = null;
      var airFilter = null;
      var eqFrequencies = [32, 64, 250, 1000, 4000, 8000, 16000];
      var eqFilters = [];
      var oscList = [];
      var chordTimer = null;
      var audioEl = null;
      var mediaSourceNode = null;
      var mediaSourceCreated = false;

      function initContext() {
        if (!ctx) {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            try {
              ctx = new AudioCtx({ latencyHint: 'playback', sampleRate: 192000 });
            } catch (e1) {
              try {
                ctx = new AudioCtx({ latencyHint: 'playback', sampleRate: 96000 });
              } catch (e2) {
                try {
                  ctx = new AudioCtx({ latencyHint: 'playback' });
                } catch (e3) {
                  ctx = new AudioCtx();
                }
              }
            }
            buildDSPGraph();
          }
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume();
        }
      }

      function buildDSPGraph() {
        if (!ctx) return;
        // Studio Master Preamp for Headroom Management (Eliminates digital clipping)
        preampGain = ctx.createGain();
        preampGain.gain.setValueAtTime(0.86, ctx.currentTime);

        masterGain = ctx.createGain();
        masterGain.gain.setValueAtTime(currentVolume, ctx.currentTime);

        // Studio-grade Brickwall Limiter (Guarantees 100% distortion-free clarity)
        masterLimiter = ctx.createDynamicsCompressor();
        masterLimiter.threshold.setValueAtTime(-0.5, ctx.currentTime);
        masterLimiter.knee.setValueAtTime(3.0, ctx.currentTime);
        masterLimiter.ratio.setValueAtTime(16.0, ctx.currentTime);
        masterLimiter.attack.setValueAtTime(0.002, ctx.currentTime);
        masterLimiter.release.setValueAtTime(0.10, ctx.currentTime);

        channelLeftGain = ctx.createGain();
        channelRightGain = ctx.createGain();

        // 7-Band Audiophile Equalizer Pipeline (Default: Audiophile Clear)
        eqFilters = [];
        var defaultEqGains = [4.5, 3.5, 1.0, 1.5, 2.0, 2.5, 3.0];
        for (var i = 0; i < eqFrequencies.length; i++) {
          var eqNode = ctx.createBiquadFilter();
          eqNode.frequency.setValueAtTime(eqFrequencies[i], ctx.currentTime);
          if (i === 0) {
            eqNode.type = 'lowshelf';
          } else if (i === eqFrequencies.length - 1) {
            eqNode.type = 'highshelf';
          } else {
            eqNode.type = 'peaking';
            eqNode.Q.setValueAtTime(1.1, ctx.currentTime);
          }
          eqNode.gain.setValueAtTime(defaultEqGains[i] || 0.0, ctx.currentTime);
          eqFilters.push(eqNode);
        }

        // Chain the 7 EQ bands in series
        for (var j = 0; j < eqFilters.length - 1; j++) {
          eqFilters[j].connect(eqFilters[j + 1]);
        }

        // Dedicated Sub-Bass & Low-End Punch Filters (Tuned for maximum clarity & punch)
        ultraSubBassFilter = ctx.createBiquadFilter();
        ultraSubBassFilter.type = 'lowshelf';
        ultraSubBassFilter.frequency.setValueAtTime(36, ctx.currentTime);
        ultraSubBassFilter.gain.setValueAtTime(isBassBoost ? (bassGainDb * 0.45) : 0.0, ctx.currentTime);

        subBassFilter = ctx.createBiquadFilter();
        subBassFilter.type = 'peaking';
        subBassFilter.frequency.setValueAtTime(46, ctx.currentTime);
        subBassFilter.Q.setValueAtTime(1.3, ctx.currentTime);
        subBassFilter.gain.setValueAtTime(isBassBoost ? (bassGainDb * 0.40) : 0.0, ctx.currentTime);

        bassBoostFilter = ctx.createBiquadFilter();
        bassBoostFilter.type = 'lowshelf';
        bassBoostFilter.frequency.setValueAtTime(80, ctx.currentTime);
        bassBoostFilter.gain.setValueAtTime(isBassBoost ? (bassGainDb * 0.30) : 0.0, ctx.currentTime);

        punchFilter = ctx.createBiquadFilter();
        punchFilter.type = 'peaking';
        punchFilter.frequency.setValueAtTime(120, ctx.currentTime);
        punchFilter.Q.setValueAtTime(1.1, ctx.currentTime);
        punchFilter.gain.setValueAtTime(isBassBoost ? (bassGainDb * 0.15) : 0.0, ctx.currentTime);

        // High-Frequency Studio Air & Sparkle Filter (>10kHz)
        airFilter = ctx.createBiquadFilter();
        airFilter.type = 'highshelf';
        airFilter.frequency.setValueAtTime(10000, ctx.currentTime);
        airFilter.gain.setValueAtTime(2.2, ctx.currentTime);

        // Pristine audio chain:
        // EQ -> ultraSub -> subBass -> bassBoost -> punch -> airFilter -> preampGain -> masterGain -> masterLimiter -> destination
        eqFilters[eqFilters.length - 1].connect(ultraSubBassFilter);
        ultraSubBassFilter.connect(subBassFilter);
        subBassFilter.connect(bassBoostFilter);
        bassBoostFilter.connect(punchFilter);
        punchFilter.connect(airFilter);
        airFilter.connect(preampGain);
        preampGain.connect(masterGain);
        masterGain.connect(masterLimiter);
        masterLimiter.connect(ctx.destination);

        // Natural Binaural Crossfeed (Natural 350μs ITD, zero destructive comb-filtering)
        delayL = ctx.createDelay(0.05);
        delayR = ctx.createDelay(0.05);
        delayL.delayTime.setValueAtTime(0.00035, ctx.currentTime);
        delayR.delayTime.setValueAtTime(0.00035, ctx.currentTime);

        filterL = ctx.createBiquadFilter();
        filterR = ctx.createBiquadFilter();
        filterL.type = 'lowpass';
        filterR.type = 'lowpass';
        filterL.frequency.setValueAtTime(750, ctx.currentTime);
        filterR.frequency.setValueAtTime(750, ctx.currentTime);

        crossGainL = ctx.createGain();
        crossGainR = ctx.createGain();
        crossGainL.gain.setValueAtTime(0.0, ctx.currentTime);
        crossGainR.gain.setValueAtTime(0.0, ctx.currentTime);

        leftPanner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
        rightPanner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;

        if (leftPanner && rightPanner) {
          leftPanner.pan.setValueAtTime(-1.0, ctx.currentTime);
          rightPanner.pan.setValueAtTime(1.0, ctx.currentTime);

          channelLeftGain.connect(leftPanner);
          channelRightGain.connect(rightPanner);

          // Subtle natural crossfeed
          channelLeftGain.connect(delayL);
          delayL.connect(filterL);
          filterL.connect(crossGainL);
          crossGainL.connect(rightPanner);

          channelRightGain.connect(delayR);
          delayR.connect(filterR);
          filterR.connect(crossGainR);
          crossGainR.connect(leftPanner);

          leftPanner.connect(eqFilters[0]);
          rightPanner.connect(eqFilters[0]);
        } else {
          channelLeftGain.connect(eqFilters[0]);
          channelRightGain.connect(eqFilters[0]);
        }
      }

      function updateDSP() {
        if (!ctx) return;
        var effCross = isSpatial ? (0.12 * spatialDepth * spatialIntensity) : 0.0;
        var panVal = isSpatial ? Math.min(1.0, 0.85 + (spatialWidth - 1.0) * 0.15) : 1.0;

        if (leftPanner) leftPanner.pan.setTargetAtTime(-panVal, ctx.currentTime, 0.05);
        if (rightPanner) rightPanner.pan.setTargetAtTime(panVal, ctx.currentTime, 0.05);
        if (crossGainL) crossGainL.gain.setTargetAtTime(effCross, ctx.currentTime, 0.05);
        if (crossGainR) crossGainR.gain.setTargetAtTime(effCross, ctx.currentTime, 0.05);

        var targetBass = isBassBoost ? Math.min(bassGainDb, 14.0) : 0.0;
        var subEnhanceGain = isSubBassEnhancement ? (subBassIntensity * 6.0 * Math.pow(10.0, subBassOutputLevelDb / 20.0)) : 0.0;
        if (ultraSubBassFilter) {
          ultraSubBassFilter.frequency.setTargetAtTime(Math.min(45, subBassFrequency * 0.7), ctx.currentTime, 0.05);
          ultraSubBassFilter.gain.setTargetAtTime((targetBass * 0.45) + (subEnhanceGain * 0.65), ctx.currentTime, 0.05);
        }
        if (subBassFilter) {
          subBassFilter.frequency.setTargetAtTime(subBassFrequency, ctx.currentTime, 0.05);
          subBassFilter.gain.setTargetAtTime((targetBass * 0.40) + (subEnhanceGain * 0.55), ctx.currentTime, 0.05);
        }
        if (bassBoostFilter) bassBoostFilter.gain.setTargetAtTime(targetBass * 0.30, ctx.currentTime, 0.05);
        if (punchFilter) punchFilter.gain.setTargetAtTime(targetBass * 0.15, ctx.currentTime, 0.05);
        if (airFilter) airFilter.gain.setTargetAtTime(2.2, ctx.currentTime, 0.05);

        // Preamp Headroom: Guarantees zero clipping even on aggressive mastering while preserving full dynamic punch
        var headroomRatio = (isBassBoost || isSubBassEnhancement) ? 0.82 : 0.96;
        if (preampGain) preampGain.gain.setTargetAtTime(headroomRatio, ctx.currentTime, 0.05);
      }

      function playAudioUrl(url) {
        try {
          if (!audioEl) {
            audioEl = new Audio();
            audioEl.crossOrigin = 'anonymous';
            audioEl.preload = 'auto';
          }
          if (ctx && ctx.state === 'suspended') {
            ctx.resume();
          }
          if (ctx && ctx.createMediaElementSource && !mediaSourceCreated) {
            try {
              mediaSourceNode = ctx.createMediaElementSource(audioEl);
              var splitter = ctx.createChannelSplitter ? ctx.createChannelSplitter(2) : null;
              if (splitter && channelLeftGain && channelRightGain) {
                mediaSourceNode.connect(splitter);
                splitter.connect(channelLeftGain, 0); // Discrete Left channel
                splitter.connect(channelRightGain, 1); // Discrete Right channel
              } else if (eqFilters.length > 0) {
                mediaSourceNode.connect(eqFilters[0]);
              } else {
                mediaSourceNode.connect(masterGain);
              }
              mediaSourceCreated = true;
            } catch (nodeErr) {
              console.warn('[AUDIO DSP] MediaElementSource creation notice:', nodeErr);
            }
          }
          if (audioEl.src !== url) {
            audioEl.src = url;
            audioEl.load();
          }
          audioEl.currentTime = 0;
          audioEl.volume = currentVolume;
          var p = audioEl.play();
          if (p !== undefined) {
            p.catch(function(err) {
              console.warn('[AUDIO] Media play rejected:', err);
            });
          }
        } catch (err) {
          console.warn('[AUDIO] Error in playAudioUrl:', err);
        }
      }

      var chords = [
        { bass: 55.0, notes: [220.0, 261.63, 329.63, 392.0] }, // Am7: A1 bass (55Hz)
        { bass: 43.65, notes: [174.61, 220.0, 261.63, 329.63] }, // Fmaj7: F1 bass (43.65Hz)
        { bass: 65.41, notes: [261.63, 329.63, 392.0, 493.88] }, // Cmaj7: C2 bass (65.41Hz)
        { bass: 49.0, notes: [196.0, 246.94, 293.66, 392.0] } // G7: G1 bass (49Hz)
      ];
      var chordIndex = 0;

      function playChord() {
        if (!isPlaying || !ctx) return;
        stopOscillators();
        var chordObj = chords[chordIndex % chords.length];
        chordIndex++;

        // Deep 808 Sub-Bass fundamental punch oscillator
        var bassOsc = ctx.createOscillator();
        var bassGain = ctx.createGain();
        bassOsc.type = 'sine';
        bassOsc.frequency.setValueAtTime(chordObj.bass, ctx.currentTime);
        bassOsc.frequency.exponentialRampToValueAtTime(chordObj.bass * 0.95, ctx.currentTime + 0.16);

        // Ultra Sub-Bass sub-octave oscillator (25-35Hz deep sub rumble)
        var ultraSubOsc = ctx.createOscillator();
        var ultraSubGain = ctx.createGain();
        ultraSubOsc.type = 'sine';
        ultraSubOsc.frequency.setValueAtTime(chordObj.bass * 0.5, ctx.currentTime);

        // Sub-Bass 2nd harmonic oscillator (acoustic warmth & punch)
        var subHarmonicOsc = ctx.createOscillator();
        var subHarmonicGain = ctx.createGain();
        subHarmonicOsc.type = 'triangle';
        subHarmonicOsc.frequency.setValueAtTime(chordObj.bass * 2.0, ctx.currentTime);

        var bassVol = isBassBoost ? 1.0 : 0.65;
        bassGain.gain.setValueAtTime(0.001, ctx.currentTime);
        bassGain.gain.linearRampToValueAtTime(bassVol, ctx.currentTime + 0.04);
        bassGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.6);

        ultraSubGain.gain.setValueAtTime(0.001, ctx.currentTime);
        ultraSubGain.gain.linearRampToValueAtTime(bassVol * 0.85, ctx.currentTime + 0.04);
        ultraSubGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.8);

        subHarmonicGain.gain.setValueAtTime(0.001, ctx.currentTime);
        subHarmonicGain.gain.linearRampToValueAtTime(bassVol * 0.35, ctx.currentTime + 0.05);
        subHarmonicGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.2);

        bassOsc.connect(bassGain);
        ultraSubOsc.connect(ultraSubGain);
        subHarmonicOsc.connect(subHarmonicGain);

        // Feed MONO directly to EQ & Bass Boost chain to eliminate spatial phase cancellation:
        if (eqFilters.length > 0) {
          bassGain.connect(eqFilters[0]);
          ultraSubGain.connect(eqFilters[0]);
          subHarmonicGain.connect(eqFilters[0]);
        } else {
          bassGain.connect(masterGain);
          ultraSubGain.connect(masterGain);
          subHarmonicGain.connect(masterGain);
        }

        bassOsc.start();
        bassOsc.stop(ctx.currentTime + 3.8);
        oscList.push(bassOsc);

        ultraSubOsc.start();
        ultraSubOsc.stop(ctx.currentTime + 3.8);
        oscList.push(ultraSubOsc);

        subHarmonicOsc.start();
        subHarmonicOsc.stop(ctx.currentTime + 3.5);
        oscList.push(subHarmonicOsc);

        // Chord Harmony Oscillators (Panned across Dolby Atmos 7.1.4 Spatial Field)
        chordObj.notes.forEach(function(freq, i) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = i % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime);

          gain.gain.setValueAtTime(0.001, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.55 / Math.sqrt(chordObj.notes.length), ctx.currentTime + 0.5);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.8);

          osc.connect(gain);
          if (i % 2 === 0 && channelLeftGain) {
            gain.connect(channelLeftGain);
          } else if (channelRightGain) {
            gain.connect(channelRightGain);
          } else if (eqFilters.length > 0) {
            gain.connect(eqFilters[0]);
          } else {
            gain.connect(masterGain);
          }

          osc.start();
          osc.stop(ctx.currentTime + 4.0);
          oscList.push(osc);
        });

        chordTimer = setTimeout(playChord, 3600);
      }

      function stopOscillators() {
        oscList.forEach(function(o) {
          try { o.stop(); o.disconnect(); } catch(e) {}
        });
        oscList = [];
        if (chordTimer) {
          clearTimeout(chordTimer);
          chordTimer = null;
        }
      }

      return {
        init: function() { initContext(); },
        play: function(title, url, sampleRate) {
          initContext();
          isPlaying = true;
          updateDSP();
          if (url && typeof url === 'string' && url.length > 5 && (url.indexOf('http') === 0 || url.indexOf('//') === 0 || url.indexOf('blob:') === 0 || url.indexOf('data:') === 0)) {
            stopOscillators();
            playAudioUrl(url);
          } else {
            console.warn('[AUDIO] Refusing playback: no valid audio source URL provided for', title);
            isPlaying = false;
            stopOscillators();
            if (audioEl) {
              try {
                audioEl.pause();
                audioEl.removeAttribute('src');
                audioEl.load();
              } catch(e) {}
            }
          }
        },
        stop: function() {
          isPlaying = false;
          stopOscillators();
          if (audioEl) {
            try {
              audioEl.pause();
              audioEl.removeAttribute('src');
              audioEl.load();
            } catch(e) {}
          }
        },
        pause: function() {
          isPlaying = false;
          stopOscillators();
          if (audioEl) {
            try { audioEl.pause(); } catch(e) {}
          }
        },
        setSpatial: function(enabled, width, depth, intensity) {
          isSpatial = !!enabled;
          spatialWidth = typeof width === 'number' ? width : 2.4;
          spatialDepth = typeof depth === 'number' ? depth : 0.75;
          spatialIntensity = typeof intensity === 'number' ? intensity : 1.0;
          updateDSP();
        },
        setVolume: function(vol) {
          currentVolume = typeof vol === 'number' ? Math.max(0, Math.min(vol, 1.0)) : 1.0;
          if (masterGain && ctx) {
            masterGain.gain.setTargetAtTime(currentVolume, ctx.currentTime, 0.03);
          }
          if (audioEl) {
            try { audioEl.volume = currentVolume; } catch(e) {}
          }
        },
        setBassBoost: function(enabled, gainDb) {
          isBassBoost = !!enabled;
          if (typeof gainDb === 'number') bassGainDb = gainDb;
          updateDSP();
        },
        setSubBass: function(enabled, gainDb) {
          isBassBoost = !!enabled;
          if (typeof gainDb === 'number') bassGainDb = gainDb;
          updateDSP();
        },
        setSubBassEnhancement: function(enabled, intensity, frequencyHz, outputLevelDb, preset) {
          isSubBassEnhancement = !!enabled;
          if (typeof intensity === 'number') subBassIntensity = intensity;
          if (typeof frequencyHz === 'number') subBassFrequency = frequencyHz;
          if (typeof outputLevelDb === 'number') subBassOutputLevelDb = outputLevelDb;
          if (typeof preset === 'string') subBassPresetName = preset;
          updateDSP();
        },
        setEqBand: function(index, gainDb) {
          if (eqFilters[index] && ctx) {
            eqFilters[index].gain.setTargetAtTime(gainDb, ctx.currentTime, 0.05);
          }
        },
        setEqualizer: function(bands) {
          if (!bands || !bands.length) return;
          for (var i = 0; i < bands.length; i++) {
            if (eqFilters[i] && ctx) {
              eqFilters[i].gain.setTargetAtTime(bands[i], ctx.currentTime, 0.05);
            }
          }
        }
      };
    })();
  </script>
</head>

  <script src="flutter_bootstrap.js" async></script>
