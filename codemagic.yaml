workflows:
  ios-build:
    name: AuraBeat iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build AuraBeat IPA
        script: |
          chmod +x scripts/*.sh
          scripts/make-ipa.sh
    artifacts:
      - build/*.ipa
